<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sample design</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      /* A 520×720 app screen (rendered at 2x by render.mjs, like the plugin's 2x export).
         Built to show what the simulations reveal: a red/green-only legend and amounts,
         status colours, an error banner, small grey text and a low-contrast button. */
      body {
        background: #fff;
      }
      .screen {
        width: 520px;
        height: 720px;
        padding: 24px 26px 24px;
        background: #f6f7fb;
        font-family: var(--sans);
        color: #151a3a;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .app {
        font: 800 24px/1 var(--sans);
        letter-spacing: -0.02em;
      }
      .app span {
        color: #4c3df2;
      }
      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ffb347, #ff6a3d);
      }
      .balance {
        border-radius: 20px;
        padding: 20px 22px;
        color: #fff;
        background: linear-gradient(135deg, #6a5bff, #2b1d9e);
      }
      .balance .k {
        font: 600 14px/1 var(--sans);
        opacity: 0.8;
      }
      .balance .v {
        margin-top: 8px;
        font: 800 38px/1 var(--sans);
        letter-spacing: -0.02em;
      }
      .balance .chips {
        margin-top: 14px;
        display: flex;
        gap: 8px;
      }
      .chip {
        font: 700 13px/1 var(--sans);
        padding: 7px 10px;
        border-radius: 999px;
      }
      .chip.up {
        background: #2ecc71;
        color: #fff;
      }
      .chip.down {
        background: #ff5a4e;
        color: #fff;
      }
      .card {
        background: #fff;
        border-radius: 18px;
        padding: 16px 18px;
        box-shadow: 0 2px 10px rgba(21, 26, 58, 0.05);
      }
      .card h3 {
        margin: 0 0 12px;
        font: 700 15px/1 var(--sans);
        display: flex;
        justify-content: space-between;
      }
      .legend {
        font: 600 12px/1 var(--sans);
        color: #8a8fa8;
        display: flex;
        gap: 12px;
      }
      .legend i {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 3px;
        margin-right: 5px;
      }
      .bars {
        height: 84px;
        display: flex;
        align-items: flex-end;
        gap: 14px;
        padding: 0 4px;
      }
      .day {
        flex: 1;
        display: flex;
        align-items: flex-end;
        gap: 4px;
        height: 100%;
      }
      .day b {
        flex: 1;
        border-radius: 4px 4px 2px 2px;
      }
      .days {
        margin-top: 6px;
        display: flex;
        gap: 14px;
        padding: 0 4px;
        font: 600 11px/1 var(--sans);
        color: #a3a7bd;
      }
      .days span {
        flex: 1;
        text-align: center;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 0;
        border-top: 1px solid #f0f1f6;
      }
      .row:first-of-type {
        border-top: 0;
        padding-top: 0;
      }
      .dot {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        flex: none;
      }
      .row .t {
        flex: 1;
        font: 700 14px/1.2 var(--sans);
      }
      .row .t small {
        display: block;
        font: 500 12px/1.3 var(--sans);
        color: #a3a7bd;
      }
      .amt {
        font: 800 15px/1 var(--sans);
      }
      .amt.plus {
        color: #1fae5b;
      }
      .amt.minus {
        color: #ef4a3f;
      }
      .alert {
        border-radius: 14px;
        padding: 12px 14px;
        background: #ffe8e6;
        color: #c62f25;
        font: 700 13px/1.35 var(--sans);
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .alert::before {
        content: "!";
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #ef4a3f;
        color: #fff;
        font: 800 13px/20px var(--sans);
        text-align: center;
        flex: none;
      }
      .actions {
        margin-top: auto;
        display: flex;
        gap: 10px;
      }
      .btn {
        flex: 1;
        height: 46px;
        border-radius: 12px;
        font: 800 15px/46px var(--sans);
        text-align: center;
      }
      .btn.primary {
        background: #2ecc71;
        color: #fff;
      }
      .btn.ghost {
        background: #eceef5;
        color: #b4b8cb; /* deliberately low contrast */
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="top">
        <div class="app">Spend<span>wise</span></div>
        <div class="avatar"></div>
      </div>

      <div class="balance">
        <div class="k">Balance</div>
        <div class="v">$4,825.40</div>
        <div class="chips"><span class="chip up">▲ 12% income</span><span class="chip down">▼ 4% spending</span></div>
      </div>

      <div class="card">
        <h3>This week
          <span class="legend"><span><i style="background:#2ecc71"></i>Income</span><span><i style="background:#ff5a4e"></i>Spending</span></span>
        </h3>
        <div class="bars" id="bars"></div>
        <div class="days"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
      </div>

      <div class="card">
        <div class="row"><div class="dot" style="background:#ffe1dd"></div><div class="t">Groceries<small>Today · Card</small></div><div class="amt minus">−$64.20</div></div>
        <div class="row"><div class="dot" style="background:#d9f6e6"></div><div class="t">Salary<small>Yesterday · Transfer</small></div><div class="amt plus">+$2,400.00</div></div>
        <div class="row"><div class="dot" style="background:#e6e3ff"></div><div class="t">Streaming<small>Mon · Card</small></div><div class="amt minus">−$12.99</div></div>
      </div>

      <div class="alert">Payment to Electricity failed. Try another card.</div>

      <div class="actions"><div class="btn ghost">Cancel</div><div class="btn primary">Add expense</div></div>
    </div>
    <script>
      // Income (green) and spending (red) bars, Monday to Sunday
      const week = [[60, 35], [42, 58], [75, 30], [38, 64], [82, 44], [30, 70], [55, 26]];
      document.getElementById("bars").innerHTML = week
        .map(([inc, out]) => `<div class="day"><b style="height:${inc}%;background:#2ecc71"></b><b style="height:${out}%;background:#ff5a4e"></b></div>`)
        .join("");
    </script>
  </body>
</html>
